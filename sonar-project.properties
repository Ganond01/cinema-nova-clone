sonar.projectKey=cinema-nova
sonar.projectName=Cinema Nova
sonar.sources=src,server,server.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/uploads/**,**/public/uploads/**
sonar.sourceEncoding=UTF-8

# Fix for "Failed to start the bridge server (300s timeout)":
# Skip downloading/deploying embedded Node.js runtime and use host system Node.js
sonar.scanner.skipNodeProvisioning=true
sonar.nodejs.executable=node
sonar.javascript.node.maxspace=1024
