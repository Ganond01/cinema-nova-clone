<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <!-- Radial & Linear Gradients for Crimson Gothic Sky & Moon -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0004"/>
      <stop offset="35%" stop-color="#4a040b"/>
      <stop offset="70%" stop-color="#180002"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <radialGradient id="bloodMoon" cx="72%" cy="22%" r="20%">
      <stop offset="0%" stop-color="#ff4a58" stop-opacity="1"/>
      <stop offset="40%" stop-color="#d41424" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#80050d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a040b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="72%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#ff2638" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#b30c1b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#540008" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d0006" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6e0510" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#990b19" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#240004" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#470007" stop-opacity="0"/>
      <stop offset="50%" stop-color="#69020d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="fogBlur">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="600" fill="url(#skyGrad)"/>

  <!-- Red Moon Aura Glow -->
  <circle cx="1150" cy="130" r="280" fill="url(#moonGlow)"/>

  <!-- Blood Red Moon Crescent / Sphere -->
  <circle cx="1150" cy="130" r="70" fill="url(#bloodMoon)"/>
  <circle cx="1150" cy="130" r="69" stroke="#ff7582" stroke-width="1.5" fill="none" opacity="0.8"/>
  <circle cx="1135" cy="120" r="60" fill="#2d0004" opacity="0.6"/>

  <!-- Dramatic Crimson Cloud Waves in Sky -->
  <path d="M0,180 Q300,120 700,200 T1600,160 L1600,320 L0,320 Z" fill="url(#cloudGrad)" filter="url(#fogBlur)"/>
  <path d="M200,110 Q600,70 1050,140 T1600,100 L1600,240 L200,240 Z" fill="url(#cloudGrad)" opacity="0.6" filter="url(#softBlur)"/>

  <!-- Distant Background Gothic Skyscrapers (Layer 1 - deep silhouette) -->
  <g fill="#160003" opacity="0.85">
    <!-- Left skyscrapers -->
    <polygon points="60,600 60,250 85,250 85,190 95,190 95,140 98,90 101,140 101,190 110,190 110,250 135,250 135,600"/>
    <polygon points="120,600 120,290 140,270 160,270 180,290 180,600"/>
    <polygon points="210,600 210,220 225,200 240,200 240,160 245,120 250,160 250,200 265,200 280,220 280,600"/>
    <polygon points="320,600 320,310 370,310 370,600"/>
    
    <!-- Center Background Towers -->
    <polygon points="460,600 460,180 485,150 495,150 495,80 500,40 505,80 505,150 515,150 540,180 540,600"/>
    <polygon points="560,600 560,270 610,270 610,600"/>
    <polygon points="650,600 650,210 670,190 690,190 690,130 695,70 700,130 700,190 720,190 740,210 740,600"/>
    <polygon points="770,600 770,290 820,260 870,290 870,600"/>

    <!-- Right Towers (under/near moon) -->
    <polygon points="980,600 980,230 1010,230 1010,170 1025,170 1030,110 1035,170 1050,170 1050,230 1080,230 1080,600"/>
    <polygon points="1240,600 1240,220 1270,180 1285,180 1285,120 1290,60 1295,120 1295,180 1310,180 1340,220 1340,600"/>
    <polygon points="1370,600 1370,290 1430,290 1430,600"/>
    <polygon points="1460,600 1460,200 1485,170 1495,170 1495,100 1500,50 1505,100 1505,170 1515,170 1540,200 1540,600"/>
  </g>

  <!-- Midground Gothic High-Rises & Spires with Window Lights (Layer 2) -->
  <g fill="#0b0002">
    <!-- Left Gothic Cathedral / Skyscraper -->
    <polygon points="160,600 160,210 175,190 190,190 190,130 195,70 200,130 200,190 215,190 230,210 230,600"/>
    <polygon points="260,600 260,260 300,220 340,260 340,600"/>
    <polygon points="380,600 380,160 410,120 420,120 420,50 425,10 430,50 430,120 440,120 470,160 470,600"/>

    <!-- Mid Spires -->
    <polygon points="580,600 580,200 610,170 620,170 620,90 625,30 630,90 630,170 640,170 670,200 670,600"/>
    <polygon points="710,600 710,250 770,250 770,600"/>
    <polygon points="810,600 810,180 840,150 850,150 850,80 855,20 860,80 860,150 870,150 900,180 900,600"/>

    <!-- Right Gothic Spire (directly behind detective silhouette) -->
    <polygon points="1100,600 1100,260 1130,230 1160,230 1190,260 1190,600"/>
    <polygon points="1200,600 1200,190 1225,160 1235,160 1235,90 1240,30 1245,90 1245,160 1255,160 1280,190 1280,600"/>
    <polygon points="1310,600 1310,240 1350,200 1390,240 1390,600"/>
    <polygon points="1420,600 1420,160 1450,120 1460,120 1460,60 1465,10 1470,60 1470,120 1480,120 1510,160 1510,600"/>
  </g>

  <!-- Lit Gothic Windows pattern (crimson glowing dots) -->
  <g fill="#ff3848" opacity="0.35">
    <rect x="185" y="230" width="3" height="6"/>
    <rect x="195" y="230" width="3" height="6"/>
    <rect x="185" y="260" width="3" height="6"/>
    <rect x="195" y="260" width="3" height="6"/>
    <rect x="185" y="290" width="3" height="6"/>
    <rect x="195" y="290" width="3" height="6"/>

    <rect x="415" y="180" width="4" height="7"/>
    <rect x="430" y="180" width="4" height="7"/>
    <rect x="415" y="210" width="4" height="7"/>
    <rect x="430" y="210" width="4" height="7"/>
    <rect x="415" y="240" width="4" height="7"/>
    <rect x="430" y="240" width="4" height="7"/>
    <rect x="415" y="270" width="4" height="7"/>
    <rect x="430" y="270" width="4" height="7"/>

    <rect x="615" y="210" width="4" height="6"/>
    <rect x="630" y="210" width="4" height="6"/>
    <rect x="615" y="240" width="4" height="6"/>
    <rect x="630" y="240" width="4" height="6"/>

    <rect x="845" y="190" width="4" height="7"/>
    <rect x="860" y="190" width="4" height="7"/>
    <rect x="845" y="220" width="4" height="7"/>
    <rect x="860" y="220" width="4" height="7"/>
    <rect x="845" y="250" width="4" height="7"/>
    <rect x="860" y="250" width="4" height="7"/>

    <rect x="1230" y="200" width="4" height="7"/>
    <rect x="1245" y="200" width="4" height="7"/>
    <rect x="1230" y="230" width="4" height="7"/>
    <rect x="1245" y="230" width="4" height="7"/>

    <rect x="1455" y="180" width="4" height="7"/>
    <rect x="1470" y="180" width="4" height="7"/>
    <rect x="1455" y="210" width="4" height="7"/>
    <rect x="1470" y="210" width="4" height="7"/>
  </g>

  <!-- Low Gothic Rooftops and Rubble Foreground (Layer 3) -->
  <polygon points="0,600 0,420 180,440 320,400 480,450 640,410 800,460 980,400 1150,430 1320,390 1480,440 1600,410 1600,600" fill="#040001"/>

  <!-- Dense Atmosphere / Low Red Fog Overlay -->
  <rect x="0" y="280" width="1600" height="320" fill="url(#fogGrad)"/>

  <!-- DETECTIVE SILHOUETTE IN FOREGROUND (Right of Center) -->
  <g fill="#020001" stroke="#020001" stroke-linejoin="round">
    <!-- Detective Fedora Hat -->
    <!-- Crown -->
    <path d="M1065,135 Q1082,118 1102,122 Q1122,118 1138,135 L1134,160 Q1102,156 1070,160 Z" />
    <!-- Brim -->
    <path d="M1042,160 Q1102,148 1162,158 Q1130,166 1042,160 Z" stroke-width="2"/>

    <!-- Head & Neck with high collar -->
    <ellipse cx="1102" cy="172" rx="19" ry="20"/>

    <!-- Trench Coat Collar popped up high -->
    <polygon points="1062,185 1074,168 1092,185 1084,205"/>
    <polygon points="1142,185 1130,168 1112,185 1120,205"/>

    <!-- Broad Shoulders & Upper Body -->
    <path d="M1064,188 Q1035,215 1025,270 L1020,380 L1040,380 L1048,275 Q1102,260 1156,275 L1164,380 L1184,380 L1179,270 Q1169,215 1140,188 Z"/>

    <!-- Left Arm hanging slightly holding umbrella / cane -->
    <path d="M1025,270 L1012,380 L1016,425 L1030,425 L1035,380 L1045,275 Z"/>
    
    <!-- Right Arm hanging with subtle weapon / silhouette detail -->
    <path d="M1179,270 L1192,380 L1194,435 L1180,445 L1170,380 L1159,275 Z"/>
    <line x1="1187" y1="435" x2="1190" y2="475" stroke="#020001" stroke-width="3"/>

    <!-- Flowing Long Trench Coat to below knees -->
    <path d="M1044,275 Q1020,440 1000,560 L1204,560 Q1184,440 1160,275 Q1102,265 1044,275 Z"/>
    <path d="M1000,560 Q1102,575 1204,560 L1215,600 L989,600 Z"/>

    <!-- Legs & Trench Coat Tail Flutter -->
    <rect x="1055" y="550" width="35" height="50"/>
    <rect x="1115" y="550" width="35" height="50"/>
  </g>

  <!-- Crimson Edge Rim Lighting on Detective's Silhouette -->
  <path d="M1044,161 Q1102,150 1160,159" stroke="#ff4a58" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M1142,185 Q1170,225 1179,270 L1192,380" stroke="#ff3848" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M1065,136 Q1082,120 1102,123" stroke="#ff6572" stroke-width="1.2" fill="none" opacity="0.7"/>
</svg>
