# ==============================================================================
# УВАГА: Цей docker-compose призначений ВИКЛЮЧНО ДЛЯ ЛОКАЛЬНОЇ РОЗРОБКИ на ноутбуці!
# НЕ РОЗГОРТАТИ НА STAGE / PROD!
#
# ==============================================================================

services:
  postgres_local:
    image: postgres:16-alpine
    container_name: cinemanova_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinemanova_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cinemanova
    ports:
      # Прив'язка тільки до 127.0.0.1 (захист від доступу із зовнішньої мережі)
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemanova_app -d cinemanova"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin_local:
    image: dpage/pgadmin4:latest
    container_name: cinemanova_pgadmin_local
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cinemanova.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres_local

volumes:
  pgdata_local:
